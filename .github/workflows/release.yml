name: Release Tauri updater artifacts

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build and publish signed NSIS updater artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'NewAPI 监控 ${{ github.ref_name }}'
          releaseBody: '由 GitHub Actions 自动构建的 Windows NSIS 安装包。'
          releaseDraft: false
          prerelease: false
      # tauri-action 在中文文件名（NewAPI监控_*.exe）下匹配 .sig 失败，会跳过
      # latest.json 上传（构建日志见 "Signature not found for the updater JSON"）。
      # 该步骤通过 GitHub API 补齐，保证旧版本客户端可检查更新。
      - name: Generate and upload updater latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/upload-updater-json.mjs
